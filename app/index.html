<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ສິດຄູນຊັບ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#FF7A00; --brand-2:#FFC56B; --brand-d:#D95500; --brand-soft:#FFF1E6;
  --ink:#0F1F19; --ink-2:#1C2E27; --muted:#5F7068; --line:#E2EBE6;
  --bg:#EEF5F1;--forest:#00261C;--forest-2:#004634;--forest-3:#00674F;--forest-soft:#D7F5E6;--em:#009B77;--em-2:#50C878;--em-3:#8FE3B5; --card:#fff;
  --teal:#00805F; --teal-soft:#D7F5E6; --amber:#D97706; --amber-soft:#FEF3C7;
  --green:#00805F; --green-soft:#D7F5E6; --red:#E11D48; --red-soft:#FFE4E8; --blue:#2563EB; --blue-soft:#E0EAFF;
  --mint:#d9f1ee;
  --r:18px; --shadow:0 1px 2px rgba(0,38,28,.05),0 8px 24px rgba(0,38,28,.07);
  --acc:var(--brand); --acc-soft:var(--brand-soft);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter","Noto Sans Lao","Phetsarath OT",system-ui,sans-serif;background:radial-gradient(1200px 500px at 70% -200px,rgba(0,155,119,.14),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:240px;background:radial-gradient(circle at 0% 0%,rgba(80,200,120,.35) 0,transparent 42%),radial-gradient(circle at 50% 100%,rgba(0,155,119,.25) 0,transparent 50%),linear-gradient(180deg,#005440 0%,#004634 40%,#00261C 100%);color:#fff;padding:20px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;box-shadow:4px 0 30px rgba(0,38,28,.25)}
.brand{display:flex;align-items:center;gap:12px;margin:0 4px 28px}
.brand img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:15px;padding:4px;box-shadow:0 0 0 2px rgba(143,227,181,.5),0 0 22px rgba(80,200,120,.55)}
.brand b{font-size:15px;line-height:1.25}
.brand small{color:var(--brand-2);font-size:10.5px;letter-spacing:1.6px;font-weight:700;text-shadow:0 0 12px rgba(255,122,0,.6)}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#BDF0D2;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left;margin-bottom:6px;font-weight:600;transition:.15s}
.nav button:hover{background:rgba(143,227,181,.12);color:#fff}
.nav button.on{background:linear-gradient(135deg,#50C878,#00805F);color:#fff;box-shadow:0 0 0 1px rgba(189,240,210,.5),0 0 26px rgba(80,200,120,.6);text-shadow:0 1px 2px rgba(0,38,28,.4)}
.nav .ic{width:22px;height:22px;display:grid;place-items:center}.nav .ic svg{width:20px;height:20px}
main{flex:1;min-width:0;padding:26px 28px;max-width:1120px;margin:0 auto;width:100%}
h1{font-size:24px;margin:0 0 18px;letter-spacing:-.2px}
h2{font-size:16.5px;margin:0 0 12px}
.ptitle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ptitle-row h1{margin:0}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid rgba(0,0,0,.03)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chead h2{margin:0;display:flex;align-items:center;gap:10px}
.hic{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;background:var(--forest-soft);font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #E5E2DC;border-radius:10px;background:#FCFBF9;transition:.15s}
input:hover,select:hover,textarea:hover{border-color:#D6D2CA}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px var(--acc-soft)}
.btn{border:0;border-radius:11px;padding:10px 16px;cursor:pointer;font-weight:700;background:#EFECE7;color:var(--ink);white-space:nowrap;transition:transform .12s,box-shadow .12s,background .12s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.pri{background:linear-gradient(135deg,#FF9F1C,#FF6B00);color:#fff;box-shadow:0 0 0 1px rgba(255,197,107,.5),0 8px 22px rgba(255,122,0,.4)}
.btn.pri:hover{box-shadow:0 0 0 1px rgba(255,197,107,.7),0 0 30px rgba(255,122,0,.6)}
.btn.dark{background:linear-gradient(135deg,#009B77,#00674F);color:#fff;box-shadow:0 0 0 1px rgba(143,227,181,.5),0 8px 22px rgba(0,155,119,.38)}
.btn.white{background:linear-gradient(135deg,#FF9F1C,#FF6B00);color:#fff;box-shadow:0 0 0 1px rgba(255,197,107,.6),0 0 28px rgba(255,122,0,.55)}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(189,240,210,.55);backdrop-filter:blur(6px);box-shadow:0 0 20px rgba(80,200,120,.3)}
.btn.lg{padding:14px 20px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border:1.5px dashed #CFCAC1;color:var(--muted)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.link{border:0;background:none;color:var(--brand-d);font-weight:700;cursor:pointer;padding:4px}
.seg{display:inline-flex;background:#ECE9E4;border-radius:13px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted);transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg button.on.t-receipt{background:var(--teal);color:#fff}
.seg button.on.t-quote{background:var(--amber);color:#fff}
/* ---------- hero + stats ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 26px;margin-bottom:18px;color:#fff;
  background:radial-gradient(circle at 96% 4%,rgba(255,197,107,.38) 0,transparent 22%),radial-gradient(circle at 0% 110%,rgba(80,200,120,.6) 0,transparent 48%),radial-gradient(circle at 55% 50%,rgba(0,155,119,.25) 0,transparent 60%),linear-gradient(135deg,#00674F 0%,#005440 45%,#00261C 100%);
  box-shadow:0 20px 44px rgba(0,103,79,.35),0 0 0 1px rgba(143,227,181,.35) inset;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:180px;height:180px;border:22px solid rgba(189,240,210,.16);transform:rotate(45deg);border-radius:18px;box-shadow:0 0 40px rgba(80,200,120,.25)}
.hero .hello{font-size:22px;line-height:1.35;font-weight:700;color:#fff;letter-spacing:-.2px;text-shadow:0 0 18px rgba(143,227,181,.55)}
.hero .hdate{color:#BDF0D2;margin-top:2px}
.hero .hsub{margin-top:12px;display:inline-block;background:rgba(255,159,28,.18);border:1px solid rgba(255,197,107,.5);color:#FFEDD5;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 0 16px rgba(255,122,0,.3)}
.hero .hact{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hleft{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
.hlogo{width:112px;height:112px;flex-shrink:0;background:#fff;border-radius:24px;padding:8px;display:grid;place-items:center;
  box-shadow:0 0 0 3px rgba(189,240,210,.55),0 0 0 8px rgba(80,200,120,.18),0 0 40px rgba(80,200,120,.55),0 10px 24px rgba(0,38,28,.35)}
.hlogo img{width:100%;height:100%;object-fit:contain}
.hco{font-size:12px;font-weight:700;letter-spacing:.3px;color:#FFC56B;text-shadow:0 0 12px rgba(255,159,28,.6);margin-bottom:2px}
.mtop{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;margin-bottom:10px}
.stat small{color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-size:23px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .unit{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
.stat.c-o .ico{background:linear-gradient(135deg,#FFEDD5,#FED7AA);box-shadow:0 0 16px rgba(255,122,0,.3)} .stat.c-o b{color:#FF6B00}
.stat.c-g .ico{background:linear-gradient(135deg,#D7F5E6,#BDF0D2);box-shadow:0 0 16px rgba(0,155,119,.35)} .stat.c-g b{color:#00805F}
.stat.c-r .ico{background:linear-gradient(135deg,#FFE4E8,#FECDD3);box-shadow:0 0 16px rgba(225,29,72,.2)}   .stat.c-r b{color:#E11D48}
.stat.c-a .ico{background:linear-gradient(135deg,#FEF3C7,#FDE68A);box-shadow:0 0 16px rgba(217,119,6,.25)} .stat.c-a b{color:#D97706}
.meter{height:6px;background:#EFECE7;border-radius:6px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8FE3B5,#009B77,#00674F);border-radius:6px;box-shadow:0 0 10px rgba(0,155,119,.7)}
/* ---------- bill list ---------- */
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s}
.drow:hover{border-color:#C7D6CD;box-shadow:0 6px 16px rgba(14,59,46,.1);transform:translateY(-1px)}
.dic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.dic.receipt{background:var(--teal-soft)} .dic.quote{background:var(--amber-soft)}
.dmain{flex:1;min-width:0}
.dmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmain small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dright{text-align:right;flex-shrink:0}
.dright b{display:block;font-variant-numeric:tabular-nums;margin-bottom:3px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{padding-left:36px;background:#fff}
.search:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
/* tables */
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{font-size:12px;color:var(--forest-2);font-weight:700;text-align:left;padding:10px 8px;border-bottom:2px solid var(--forest-soft);background:#F6FAF8;position:sticky;top:0}
table.t td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#FFFBF6}
table.t td input,table.t td select{background:transparent;border-color:transparent}
table.t td input:hover,table.t td select:hover{border-color:#E5E2DC;background:#fff}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag.q{background:var(--amber-soft);color:#A86A00}
.tag.r{background:var(--teal-soft);color:#0B6E6A}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.due{background:var(--red-soft);color:var(--red)}
.tag.cat{background:var(--blue-soft);color:var(--blue)}
/* ---------- editor ---------- */
.ed.receipt{--acc:var(--teal);--acc-soft:var(--teal-soft)}
.ed.quote{--acc:var(--amber);--acc-soft:var(--amber-soft)}
.ed .docno{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.ed .typebadge{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 4px var(--acc-soft)}
.items{overflow-x:auto}
.items .it{display:grid;grid-template-columns:28px minmax(260px,1fr) 76px 84px 118px 120px 30px;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.items .it.hd{font-size:12px;color:var(--muted);font-weight:700;border-bottom:1.5px solid var(--line)}
.items .it .no{width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.items .it.hd .no{background:none}
.items .it input{padding:8px 10px}
.items .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:#B9B4AB;cursor:pointer;font-size:20px;width:30px;height:30px;border-radius:8px}
.x:hover{color:var(--red);background:var(--red-soft)}
.agree{display:flex;gap:6px;flex-wrap:wrap;white-space:nowrap;align-items:center}
.agree small{white-space:nowrap}
.agree button{white-space:nowrap;border:1.5px solid #E5E2DC;background:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px;font-weight:600}
.agree button.y.on{background:var(--green);color:#fff;border-color:var(--green)}
.agree button.n.on{background:var(--red);color:#fff;border-color:var(--red)}
.sum{margin-top:16px;border-radius:14px;padding:16px 18px;color:#fff;background:radial-gradient(circle at 100% 0%,rgba(143,227,181,.3) 0,transparent 40%),radial-gradient(circle at 0% 100%,rgba(80,200,120,.45) 0,transparent 50%),linear-gradient(135deg,#00674F,#00261C);border-left:0;box-shadow:0 0 0 1px rgba(143,227,181,.35) inset,0 10px 28px rgba(0,103,79,.3);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sum small{color:#BDF0D2;font-weight:600}
.sum .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;text-shadow:0 0 20px rgba(143,227,181,.55)}
.sum .big span{font-size:14px;color:#BDF0D2;margin-left:6px}
.sum .chips{display:flex;gap:8px;flex-wrap:wrap}
.sum .chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:6px 12px;border-radius:10px;font-size:13px}
.sum .chip b{font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;padding:12px 0;background:linear-gradient(180deg,rgba(246,244,240,0),var(--bg) 35%);z-index:5}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,22,28,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{background:#fff;border-radius:20px;width:100%;max-width:660px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s}
@keyframes pop{from{transform:translateY(12px) scale(.98)}to{transform:none}}
.mhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.mbody{overflow:auto;padding:4px 18px 10px}
.mfoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.cat{display:inline-block;font-size:12px;font-weight:700;margin:16px 0 6px;padding:4px 12px;border-radius:20px}
.cat.c0{background:var(--brand-soft);color:var(--brand-d)}.cat.c1{background:var(--teal-soft);color:#0B6E6A}.cat.c2{background:var(--blue-soft);color:var(--blue)}
.cat.c3{background:var(--amber-soft);color:#A86A00}.cat.c4{background:#F1E8FF;color:#7C3AED}.cat.c5{background:var(--green-soft);color:var(--green)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;cursor:pointer;border:1.5px solid transparent;transition:.12s}
.pick:hover{background:#FBF8F4}
.pick:has(input:checked){background:var(--brand-soft);border-color:#E4C3A6}
.pick input{width:20px;height:20px;accent-color:var(--brand);flex-shrink:0}
.pick .nm{flex:1}
.pick .pr{font-variant-numeric:tabular-nums;color:var(--ink);font-size:13px;text-align:right;font-weight:700}
.pick .pr small{color:var(--muted);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px}
.empty .big{font-size:36px;display:block;margin-bottom:6px}
.hide,[hidden]{display:none!important}
.sync{position:absolute;bottom:18px;left:14px;right:14px;font-size:12px;color:#D7F5E6;background:rgba(0,38,28,.45);border:1px solid rgba(143,227,181,.25);padding:9px 12px;border-radius:12px;cursor:pointer}
.sync.offline{color:#FFB766}.sync.login,.sync.denied{color:#FF8A9B}
.login-wrap{min-height:70vh;display:grid;place-items:center}
.login-card{max-width:400px;width:100%;padding:28px;border-top:5px solid var(--forest-2)}

/* ======== PRINT DOCS ======== */
#print{display:none}
.paper{background:#fff;width:210mm;min-height:297mm;padding:14mm 14mm;margin:0 auto;color:#000;font-size:12.5px}
.paper.rc{background:#d9f1ee;width:148mm;min-height:210mm;padding:9mm 9mm}
.ph{display:flex;align-items:flex-start;gap:12px}
.ph img{width:70px}
.ph .co b{font-size:15px}
.ph .co div{font-size:12px}
.ph .meta{margin-left:auto;text-align:right;font-size:12px}
.ptitle{text-align:center;font-size:20px;font-weight:700;margin:10px 0 4px;text-decoration:underline}
.psub{text-align:center;margin-bottom:10px;font-size:12.5px}
table.p{width:100%;border-collapse:collapse;margin-top:6px}
table.p th,table.p td{border:1px solid #000;padding:5px 5px}
table.p th{font-weight:700;font-size:11.5px;background:rgba(0,0,0,.04)}
table.p td.c{text-align:center}
table.p td.n{text-align:right;font-variant-numeric:tabular-nums}
table.p tr.sec td{font-weight:700;background:rgba(0,0,0,.05)}
.box{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:middle;text-align:center;line-height:10px;font-size:11px}
.sigs{display:flex;justify-content:space-around;margin-top:28px;text-align:center}
.sigs div{width:40%}
.sigs .ln{border-bottom:1px dotted #000;height:46px;margin-bottom:4px}
.thanks{text-align:right;font-style:italic;font-size:11px;margin-top:10px}
.preview-wrap{background:#888;padding:20px;border-radius:12px;overflow:auto}
.preview-wrap .paper{box-shadow:0 4px 20px rgba(0,0,0,.3)}

@media (max-width:760px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;width:100%;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40;
    background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .brand{display:none}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:10px 14px;color:#fff;
    background:radial-gradient(circle at 0% 0%,rgba(80,200,120,.45) 0,transparent 55%),linear-gradient(135deg,#009B77,#004634);
    box-shadow:0 4px 18px rgba(0,70,52,.3)}
  .mtop img{width:40px;height:40px;background:#fff;border-radius:12px;padding:3px;object-fit:contain;box-shadow:0 0 14px rgba(143,227,181,.7)}
  .mtop b{display:block;font-size:14px;line-height:1.2}
  .mtop small{color:#FFC56B;font-size:10px;letter-spacing:1.5px;font-weight:700}
  .app{flex-direction:column}
  .hlogo{width:72px;height:72px;border-radius:18px;padding:5px}
  .hero .hleft{gap:14px}
  .sync{position:fixed;top:10px;right:10px;left:auto;bottom:auto;padding:5px 11px;font-size:11px;border-radius:20px;z-index:45;background:rgba(6,24,15,.92);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .nav{display:flex;align-items:flex-end}
  .nav button{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;text-align:center;margin:0;color:#8A909C;border-radius:12px}
  .nav button:hover{background:none;color:var(--ink)}
  .nav button.on{background:none;box-shadow:none;color:var(--forest-3);text-shadow:none}
  .nav button[data-v=new] .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;margin-top:-22px;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 8px 20px rgba(158,106,64,.4);font-size:20px}
  main{padding:16px 14px 100px}
  h1{font-size:21px}

  .hero .hact .btn{flex:1}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px}
  .stat b{font-size:18px}

  .items .it{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"nm nm x" "q p a";padding:12px 0}

  .items .it .no{display:none}

  .bar{flex-wrap:nowrap;gap:8px}

  .bar .cancel,.bar .lbl{display:none}
  .bar .danger{flex:0 0 46px}

  .dic{width:40px;height:40px}

}

  body{background:#fff}
  .app,.modal{display:none!important}
  #print{display:block}

}

async function initCloud(){
  if(!cloudOn())return;
  try{
    const [app,au,fs]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(FB_SDK+f)));
    const a=app.initializeApp(cloud);
    const auth=au.getAuth(a);
    let db;
    try{db=fs.initializeFirestore(a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}
    catch(e){db=fs.getFirestore(a)}
    const emu=DB.get('emu',null); // dev-only hook for the local Firebase emulator
    if(emu){au.connectAuthEmulator(auth,'http://127.0.0.1:'+emu.auth,{disableWarnings:true});fs.connectFirestoreEmulator(db,'127.0.0.1',emu.fs)}
    FB={auth,db,au,fs};
    au.onAuthStateChanged(auth,u=>{
      const wasReady=authReady;
      session=u?{email:u.email,uid:u.uid}:null; authReady=true;
      if(u)listen();else{unlisten();setSync('login')}
      if(!u||!wasReady||view==='login'||view==='loading')go('home');
    });
  }catch(e){
    console.error(e);sdkError=String(e&&e.message||e);authReady=true;setSync('offline');
    if(view==='loading')go('home');
  }
}
function listen(){
  unlisten();
  const {fs,db}=FB;
  localDocs=docs.filter(d=>!d.demo);
  const handle=kind=>snap=>{
    meta[kind]={cache:snap.metadata.fromCache,pend:snap.metadata.hasPendingWrites};
    const list=snap.docs.map(d=>d.data());
    if(kind==='product'){
      if(!snap.metadata.fromCache&&!list.length&&!seeded){seeded=true;seedCloud();return}
      if(list.length)products=list.sort((a,b)=>(a.ord??0)-(b.ord??0));
    }else if(kind==='doc'){
      if(list.length||!snap.metadata.fromCache)docs=list.filter(d=>d&&d.no&&Array.isArray(d.items)).sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no));
    }else{
      const s=list.find(x=>x.id==='main');
      if(s){settings=Object.assign({},DEFAULT_SET,s);delete settings.id}
    }
    saveLocal();updSync();refreshView(kind);
  };
  for(const k of ['product','doc','settings'])
    unsubs.push(fs.onSnapshot(fs.collection(db,COL[k]),{includeMetadataChanges:true},handle(k),
      err=>{console.error(err);setSync(err.code==='permission-denied'?'denied':'offline')}));
  listenStaff();
  // send anything saved before Firebase was ready
  const q=localQ;localQ=[];DB.set('fbqueue',localQ);
  q.forEach(w=>w.op==='set'?putRow(w.kind,w.data):removeRow(w.id,w.kind));
}
function unlisten(){unsubs.forEach(u=>u());unsubs=[]}
function seedCloud(){ // brand-new database: upload this device's price list, settings and real bills
  const {fs,db}=FB,b=fs.writeBatch(db);
  products.forEach(p=>b.set(fs.doc(db,'products',p.id),clean(p)));
  b.set(fs.doc(db,'settings','main'),clean({...settings,id:'main'}));
  localDocs.forEach(d=>b.set(fs.doc(db,'docs',d.id),clean(d)));
  b.commit().catch(writeErr);
}

  const m=Object.values(meta);

}

function putRow(kind,obj){
  if(!cloudOn())return;
  const id=kind==='settings'?'main':obj.id, data=clean(kind==='settings'?{...obj,id:'main'}:obj);
  if(!FB||!session){localQ=localQ.filter(w=>w.id!==id);localQ.push({op:'set',kind,id,data});DB.set('fbqueue',localQ);return}
  FB.fs.setDoc(FB.fs.doc(FB.db,COL[kind],id),data).catch(writeErr);
}
function removeRow(id,kind){
  if(!cloudOn())return;
  if(!FB||!session){localQ=localQ.filter(w=>w.id!==id);localQ.push({op:'del',kind,id});DB.set('fbqueue',localQ);return}
  FB.fs.deleteDoc(FB.fs.doc(FB.db,COL[kind],id)).catch(writeErr);
}

/* Staff can sign in with a phone number: it is turned into a private login ID like 2099698959@staff.sks */
const PHONE_DOMAIN="staff.sks";
function toLoginId(v){v=String(v||"").trim().toLowerCase();if(v.includes("@"))return v;let d=v.replace(/\D/g,"");if(d.startsWith("856"))d=d.slice(3);d=d.replace(/^0+/,"");return d.length>=8?d+"@"+PHONE_DOMAIN:""}
function showId(e){e=String(e||"");if(e.endsWith("@"+PHONE_DOMAIN)){const d=e.split("@")[0];return "0"+d.replace(/^(\d{2})(\d{4})(\d+)$/,"$1 $2 $3")}return e}
async function forgotPw(){
  const email=toLoginId($('#le').value);
  if(email.endsWith('@'+PHONE_DOMAIN)){$('#lmsg').textContent='ຜູ້ໃຊ້ເບີໂທ: ກະລຸນາແຈ້ງເຈົ້າຂອງຮ້ານໃຫ້ຕັ້ງລະຫັດໃໝ່ໃຫ້';return}
  if(!/^\S+@\S+\.\S+$/.test(email)){$('#lmsg').textContent='ພິມອີເມວໃຫ້ຄົບກ່ອນ (ເຊັ່ນ name@gmail.com) ແລ້ວກົດ "ລືມລະຫັດຜ່ານ?" ອີກຄັ້ງ';return}
  try{await FB.au.sendPasswordResetEmail(FB.auth,email);$('#lmsg').style.color='var(--green)';$('#lmsg').textContent='✅ ສົ່ງລິ້ງຕັ້ງລະຫັດໃໝ່ໄປທີ່ '+email+' ແລ້ວ — ເປີດອີເມວ (ກວດ Spam ນຳ) ແລ້ວກົດລິ້ງ'}
  catch(e){$('#lmsg').textContent='ສົ່ງບໍ່ໄດ້: '+(e.code||e.message)}

async function doLogin(){
  $('#lmsg').textContent='⏳ ...';
  try{await FB.au.signInWithEmailAndPassword(FB.auth,toLoginId($('#le').value),$('#lp').value)}
  catch(e){const c=e.code||'';$('#lmsg').textContent=
    /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກ':
    /network/.test(c)?'ເຊື່ອມຕໍ່ບໍ່ໄດ້ — ກວດເບິ່ງອິນເຕີເນັດ':
    /too-many/.test(c)?'ລອງຫຼາຍເທື່ອເກີນໄປ — ລໍຖ້າຈັກໜ່ອຍ':
    /operation-not-allowed/.test(c)?'ຍັງບໍ່ໄດ້ເປີດ Email/Password ໃນ Firebase':
    /api-key|invalid-api/.test(c)?'firebaseConfig ບໍ່ຖືກຕ້ອງ':('ຜິດພາດ: '+(c||e.message))}
}
function nextNo(type){
  const pre=(type==='quote'?'QT':'RC')+'-'+today().slice(2,4)+today().slice(5,7)+'-';
  const n=Math.max(0,...docs.filter(d=>d.no.startsWith(pre)).map(d=>parseInt(d.no.slice(pre.length))||0))+1;
  return pre+String(n).padStart(3,'0');
}

function laoDate(){

  <div class="row" style="margin-bottom:14px;align-items:center">
    <div class="seg" style="flex:0 0 auto">${[['all','ທັງໝົດ'],['receipt','🧾 ບິນຂາຍ'],['quote','📝 ສະເໜີລາຄາ']].map(([k,l])=>`<button class="${docFilter===k?'on':''}" onclick="docFilter='${k}';docsView()">${l}</button>`).join('')}</div>
    <label class="search"><input id="dq" placeholder="ຄົ້ນຫາ ຊື່ລູກຄ້າ / ເລກທີ" value="${esc(docQ)}" oninput="docQ=this.value;docsView();const e=$('#dq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></label>
  </div>
  <div class="card">${docTable(shown)}</div>`;
}

/* ---------- products ---------- */
function productsView(){
  setTimeout(()=>{if(can('editPrices'))return;document.querySelectorAll('#main input,#main select').forEach(e=>e.disabled=true);document.querySelectorAll('#main .x,#main .ptitle-row .btn').forEach(e=>e.style.display='none')});
  $('#main').innerHTML=`<div class="ptitle-row"><div><h1>ລາຍການສິນຄ້າ & ລາຄາ</h1><div style="color:var(--muted);font-size:13px;margin-top:2px">${products.length} ລາຍການ · ແກ້ໄຂໃນຕາຕະລາງໄດ້ເລີຍ</div></div><button class="btn pri" onclick="addProd()">+ ເພີ່ມສິນຄ້າ</button></div>
  <div class="card" style="overflow:auto"><table class="t"><tr><th>ໝວດ</th><th>ຊື່ສິນຄ້າ</th><th class="n">ລາຄາ</th><th>ຫົວໜ່ວຍ</th><th>ຄ່າຂົນສົ່ງ</th><th>ໝາຍເຫດ</th><th></th></tr>
  ${products.map((p,k)=>`<tr>
   <td><input value="${esc(p.cat)}" onchange="products[${k}].cat=this.value;saveProd(${k})"></td>
   <td><input value="${esc(p.name)}" style="min-width:180px" onchange="products[${k}].name=this.value;saveProd(${k})"></td>
   <td><input type="text" inputmode="numeric" value="${p.price?fmt(p.price):''}" style="text-align:right;min-width:110px;${p.price?'':'background:#fff7ec'}" oninput="numIn(this)" onchange="products[${k}].price=numIn(this);saveProd(${k})"></td>
   <td><input value="${esc(p.unit)}" style="width:70px" onchange="products[${k}].unit=this.value;saveProd(${k})"></td>
   <td><select onchange="products[${k}].ship=this.value;saveProd(${k})">${['','ລວມ','ບໍ່ລວມ'].map(o=>`<option ${p.ship===o?'selected':''}>${o}</option>`).join('')}</select></td>
   <td><input value="${esc(p.note)}" onchange="products[${k}].note=this.value;saveProd(${k})"></td>
   <td><button class="x" onclick="if(confirm('ລຶບ?')){removeRow(products[${k}].id,'product');products.splice(${k},1);saveLocal();productsView()}">×</button></td></tr>`).join('')}</table>
  <p style="color:var(--muted);font-size:13px">💡 ຊ່ອງສີສົ້ມ = ຍັງບໍ່ມີລາຄາ (ທໍ່ PVC ໃນ Excel ຍັງວ່າງ)</p></div>`;
}
function addProd(){products.unshift({id:uid(),ord:-Date.now(),cat:'ອື່ນໆ',name:'',price:0,unit:'',ship:'',note:''});saveProd(0);productsView()}
function saveProd(k){saveLocal();putRow('product',products[k])}
const SITE_KEYS=['company','shop','phone','address','slogan','founded','about','services','projects','whatsapp','facebook','mapUrl','email','hours'];
function saveSettings(){
  saveLocal();putRow('settings',{...settings,id:'settings'});
  // public copy for the company website (readable by anyone once Firebase is connected)
  const pub={id:'site'};SITE_KEYS.forEach(k=>pub[k]=String(settings[k]??''));putRow('public',pub);
}

/* ---------- settings ---------- */
function settingsView(){
  if(!can('settings')){noAccessSettings();return}
  const F=[['company','ຊື່ບໍລິສັດ (ໃບສະເໜີລາຄາ)'],['shop','ຊື່ຮ້ານ (ໃບບິນ)'],['phone','ເບີໂທ'],['address','ທີ່ຢູ່'],['partyA','ຝ່າຍ ກ (ຜູ້ເຊັນ)'],['thanks','ຂໍ້ຄວາມທ້າຍບິນ']];
  $('#main').innerHTML=`<h1>ຕັ້ງຄ່າ</h1>${me.owner?staffCard():''}<div class="card"><div class="chead"><h2><span class="hic">🏢</span>ຂໍ້ມູນຮ້ານ (ພິມໃສ່ບິນ)</h2></div>${F.map(([k,l])=>`<div style="margin-bottom:12px"><label class="f">${l}</label><input value="${esc(settings[k])}" onchange="settings.${k}=this.value;saveSettings()"></div>`).join('')}</div>
  <div class="card"><div class="chead"><h2><span class="hic">🌐</span>ຂໍ້ມູນເວັບໄຊທ໌ບໍລິສັດ</h2><a class="link" href="../" target="_blank">ເບິ່ງເວັບໄຊທ໌ →</a></div>
   <p style="margin-top:0;color:var(--muted);font-size:13px">ກອກຂໍ້ມູນທີ່ຈະສະແດງໃນໜ້າເວັບໄຊທ໌ຂອງບໍລິສັດ. ບ່ອນໃດປະວ່າງໄວ້ ຈະບໍ່ສະແດງ.</p>
   ${[['slogan','ຄຳຂວັນ (Slogan)','input'],['founded','ປີທີ່ສ້າງຕັ້ງ (ເຊັ່ນ 2015)','input'],['about','ກ່ຽວກັບບໍລິສັດ','area'],['services','ບໍລິການ (1 ແຖວ = 1 ບໍລິການ)','area'],['projects','ຜົນງານ (1 ແຖວ = 1 ໂຄງການ)','area'],
      ['whatsapp','ເບີ WhatsApp','input'],['facebook','ລິ້ງ Facebook','input'],['mapUrl','ລິ້ງ Google Maps ຂອງຮ້ານ','input'],['email','ອີເມວ','input'],['hours','ເວລາເປີດ-ປິດ','input']]
     .map(([k,l,t])=>`<div style="margin-bottom:12px"><label class="f">${l}</label>${t==='area'
       ?`<textarea rows="4" onchange="settings.${k}=this.value;saveSettings()">${esc(settings[k])}</textarea>`
       :`<input value="${esc(settings[k])}" onchange="settings.${k}=this.value;saveSettings()">`}</div>`).join('')}
  </div>
  <div class="card"><h2>☁️ ຖານຂໍ້ມູນອອນໄລນ໌ (Firebase)</h2>
   ${cloudOn()?`<p style="margin-top:0">ໂປຣເຈັກ: <b>${esc(cloud.projectId)}</b> · ສະຖານະ: <b>${syncLabel()}</b>${session?` · ເຂົ້າລະບົບເປັນ <b>${esc(session.email)}</b>`:''}</p>
   ${sdkError?`<p style="color:var(--red);font-size:13px">ໂຫຼດ Firebase ບໍ່ໄດ້: ${esc(sdkError)}</p>`:''}
   <div class="row" style="margin-bottom:14px">${session?`<button class="btn" onclick="logout()">ອອກຈາກລະບົບ</button>`:`<button class="btn pri" onclick="go('home')">ເຂົ້າສູ່ລະບົບ</button>`}
   <button class="btn" onclick="disconnectCloud()">ຕັດການເຊື່ອມຕໍ່</button></div>`
   :`<p style="margin-top:0;color:var(--muted)">ຕອນນີ້ຂໍ້ມູນເກັບຢູ່ໃນເຄື່ອງນີ້ເທົ່ານັ້ນ. ວາງ firebaseConfig ຈາກ Firebase console ເພື່ອໃຫ້ມືຖືແລະຄອມເຫັນຂໍ້ມູນດຽວກັນ.</p>
   <label class="f">firebaseConfig (ວາງທັງກ້ອນ)</label>
   <textarea id="cfg" rows="7" style="font-family:monospace;font-size:12px" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;AIza...&quot;,&#10;  authDomain: &quot;...&quot;,&#10;  projectId: &quot;...&quot;,&#10;  ...&#10;};"></textarea>
   <div class="row" style="margin-top:12px"><button class="btn pri" onclick="saveCloud()">💾 ບັນທຶກ & ເຊື່ອມຕໍ່</button></div>`}</div>
  <div class="card"><h2>ຂໍ້ມູນ</h2><div class="row"><button class="btn" onclick="exportData()">⬇️ ສຳຮອງຂໍ້ມູນ (JSON)</button>
  <button class="btn" style="color:var(--red)" onclick="if(confirm('ລ້າງຂໍ້ມູນທີ່ເກັບໄວ້ໃນເຄື່ອງນີ້? (ຂໍ້ມູນອອນໄລນ໌ບໍ່ຖືກລຶບ)')){clearLocal()}">🗑 ລ້າງຂໍ້ມູນໃນເຄື່ອງນີ້</button></div></div>`;
}
function parseConfig(t){
  const o={};for(const m of t.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];
  return o.apiKey&&o.projectId?o:null;
}
function saveCloud(){
  const c=parseConfig($('#cfg').value);
  if(!c){alert('ອ່ານ firebaseConfig ບໍ່ໄດ້ — ກວດວ່າມີ apiKey ແລະ projectId');return}
  DB.set('fbconfig',c);location.reload();
}
function disconnectCloud(){if(!confirm('ຕັດການເຊື່ອມຕໍ່? ເຄື່ອງນີ້ຈະກັບໄປໃຊ້ຂໍ້ມູນໃນເຄື່ອງ'))return;logout();DB.set('fbconfig',{off:true});setTimeout(()=>location.reload(),300)}
function clearLocal(){['products','docs','settings','fbqueue'].forEach(k=>localStorage.removeItem('sks_'+k));location.reload()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({products,docs,settings},null,1)],{type:'application/json'}));a.download='sks-backup-'+today()+'.json';a.click()}

/* ---------- print / PDF ---------- */
function paperHTML(d){
  const t=docTotal(d),p=docPaid(d);
  if(d.type==='receipt'){
    const rows=Math.max(12,d.items.length);
    return `<div class="paper rc">
     <div class="ph"><img src="${LOGO}"><div class="co"><b>${esc(settings.shop)}</b><div>☎ ${esc(settings.phone)}</div><div>${esc(settings.address)}</div></div>
     <div class="meta"><div style="font-size:19px;font-weight:700;text-decoration:underline">ໃບຮັບເງິນ</div>ເລກທີ: <b>${esc(d.no)}</b><br>ວັນທີ: <b>${dmy(d.date)}</b></div></div>
     <div style="margin-top:10px">ທ່ານ: <b>${esc(d.customer)||'....................................'}</b> ${d.project?'&nbsp; ໂຄງການ: '+esc(d.project):''}</div>
     <table class="p"><tr><th style="width:8%">ລ/ດ<br>No</th><th>ລາຍການ<br>Description</th><th style="width:13%">ຈຳນວນ<br>Qty</th><th style="width:17%">ລາຄາ<br>Price</th><th style="width:19%">ຈຳນວນເງິນ<br>Amount</th></tr>
     ${Array.from({length:rows},(_,k)=>{const i=d.items[k];return i?`<tr><td class="c">${String(k+1).padStart(2,'0')}</td><td>${esc(i.name)}</td><td class="c">${i.qty} ${esc(i.unit)}</td><td class="n">${fmt(i.price)}</td><td class="n">${fmt(i.qty*i.price)}</td></tr>`
       :`<tr><td class="c">${String(k+1).padStart(2,'0')}</td><td>&nbsp;</td><td></td><td></td><td></td></tr>`}).join('')}
     <tr><td colspan="4" style="text-align:right;font-weight:700">ລວມເງິນ:</td><td class="n" style="font-weight:700">${fmt(t)}</td></tr>
     ${p?`<tr><td colspan="4" style="text-align:right">ຈ່າຍແລ້ວ (${d.payments.map(x=>dmy(x.date)+': '+fmt(x.amount)).join(', ')})</td><td class="n">${fmt(p)}</td></tr>
     <tr><td colspan="4" style="text-align:right;font-weight:700">ຍັງຄ້າງ:</td><td class="n" style="font-weight:700">${fmt(t-p)}</td></tr>`:''}
     </table>
     ${d.note?`<div style="margin-top:6px">ໝາຍເຫດ: ${esc(d.note)}</div>`:''}
     <div class="sigs"><div><div class="ln"></div>ຜູ້ຈ່າຍເງິນ</div><div><div class="ln"></div>ຜູ້ຮັບເງິນ</div></div>
     <div class="thanks">(${esc(settings.thanks)})</div></div>`;
  }
  // quotation — matches the Excel layout with ฝ่าย ກ / ຝ່າຍ ຂ
  let cat='';
  const body=d.items.map((i,k)=>{
    const pc=(products.find(p=>p.id===i.pid)||{}).cat||'';
    const sec=pc&&pc!==cat?`<tr class="sec"><td colspan="9">${esc(cat=pc)}</td></tr>`:'';
    return sec+`<tr><td class="c">${k+1}</td><td>${esc(i.name)}</td><td class="c">${i.qty} ${esc(i.unit)}</td><td class="n">${fmt(i.price)}</td><td class="n">${fmt(i.qty*i.price)}</td>
    <td class="c" style="font-size:11px">${i.ship?esc(i.ship)+'ຄ່າຂົນ':''}</td>
    <td class="c"><span class="box">${i.agree===true?'✓':''}</span> / <span class="box">${i.agree===false?'✗':''}</span></td><td></td><td></td></tr>`}).join('');
  return `<div class="paper">
   <div class="ph"><img src="${LOGO}" style="width:90px"><div class="co"><b>${esc(settings.company)}</b><div>☎ ${esc(settings.phone)}</div><div>${esc(settings.address)}</div></div>
   <div class="meta">ເລກທີ: <b>${esc(d.no)}</b><br>ວັນທີ: <b>${dmy(d.date)}</b></div></div>
   <div class="ptitle">ໃບສະເໜີລາຄາ ວັດສະດຸ</div>
   <div class="psub">${d.project?'ໂຄງການ: <b>'+esc(d.project)+'</b>':''}</div>
   <div>ຝ່າຍ ກ: <b>${esc(settings.partyA)}</b> &nbsp;&nbsp;&nbsp; ຝ່າຍ ຂ: <b>${esc(d.customer)||'...................................'}</b></div>
   <table class="p"><tr><th style="width:5%">No</th><th>ລາຍການສິນຄ້າ</th><th style="width:10%">ຈຳນວນ</th><th style="width:11%">ລາຄາ/ໜ່ວຍ</th><th style="width:12%">ລວມ</th><th style="width:9%">ຄ່າຂົນສົ່ງ</th>
   <th style="width:11%">ເຫັນດີ / ບໍ່ເຫັນດີ</th><th style="width:8%">ຝ່າຍ ກ<br>ເຊັນ</th><th style="width:8%">ຝ່າຍ ຂ<br>ເຊັນ</th></tr>${body}
   <tr><td colspan="4" style="text-align:right;font-weight:700">ລວມທັງໝົດ</td><td class="n" style="font-weight:700">${fmt(t)}</td><td colspan="4">ກີບ</td></tr></table>
   ${d.note?`<div style="margin-top:8px">ໝາຍເຫດ: ${esc(d.note)}</div>`:''}
   <div class="sigs" style="margin-top:40px"><div>ຝ່າຍ ກ (ຜູ້ສະເໜີ)<div class="ln"></div>${esc(settings.partyA)}</div><div>ຝ່າຍ ຂ (ຜູ້ຮັບຮອງ)<div class="ln"></div>${esc(d.customer)}</div></div></div>`;
}
function previewView(){
  const d=cur;
  $('#main').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <h1 style="margin:0">ຕົວຢ່າງ ${TYPE[d.type]}</h1>
    <div style="display:flex;gap:8px">${can('editBills')?`<button class="btn" onclick="view='edit';editView()">✏️ ແກ້ໄຂ</button>`:''}<button class="btn pri" onclick="doPrint()">🖨️ ພິມ / ບັນທຶກ PDF</button></div></div>
    <div class="preview-wrap" id="pw">${paperHTML(d)}</div>`;
  fitPreview();
}
function fitPreview(){const pw=$('#pw'),pp=pw&&pw.querySelector('.paper');if(!pp)return;pp.style.transform='';const s=Math.min(1,(pw.clientWidth-16)/pp.offsetWidth);if(s<1){pp.style.transform=`scale(${s})`;pp.style.transformOrigin='top left';pw.style.height=(pp.offsetHeight*s+20)+'px'}}
window.addEventListener('resize',()=>view==='preview'&&fitPreview());
function doPrint(){
  $('#pagesize').textContent=`@page{size:${cur.type==='receipt'?'A5':'A4'};margin:0}`;
  $('#print').innerHTML=paperHTML(cur);
  document.title=cur.no+' '+(cur.customer||'');
  window.print();
  document.title='ສິດຄູນຊັບ';
}

document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);
setSync(cloudOn()?'busy':'local');
computeMe();
go('home');
initCloud();
</script>
</body>
